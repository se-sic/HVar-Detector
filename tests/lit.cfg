config.test_exec_root = os.path.join(config.hvf_tools_dir, 'tests')

import os

def inferHVF(PATH):
    # Determine which hidden variability tool to use.
    hvf = os.getenv('HVF')

    # If the user set hidden variability tool in the environment, definitely use that and don't
    # try to validate.
    if hvf:
        return hvf

    # Otherwise look in the path.
    hvf = lit.util.which('hidden-variability-finder', PATH)

    if not hvf:
        lit_config.fatal("couldn't find 'hidden-variability-finder' program, try setting "
                         "HVF in your environment")

    return hvf

config.hvf = inferHVF(config.environment['PATH']).replace('\\', '/')

if not lit_config.quiet:
    lit_config.note('using hvf: %r' % config.hvf)

